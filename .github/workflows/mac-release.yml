name: Release Mac app

# On a published GitHub Release tagged v<version>: builds the Mac app, signs it with Developer ID,
# notarizes + staples it, and attaches Waypack.dmg to that release. The site's /download/mac
# redirects to releases/latest/download/Waypack.dmg, so it serves the new DMG once attached.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the DMG to (e.g. v1.2.0)
        required: true

concurrency:
  group: mac-release
  cancel-in-progress: false

permissions:
  contents: write # attach the DMG to the release

jobs:
  mac:
    name: Build, notarize & attach DMG
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ./.github/actions/app-toolchain
      - uses: ./.github/actions/apple-signing
        with:
          p12-base64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      - name: Version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          V="${TAG#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release tag must look like v1.2.3 (got $TAG)"; exit 1; }
          { echo "TAG=$TAG"; echo "BUILD_NAME=$V"; echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))"; } >> "$GITHUB_ENV"
      - name: Build, notarize, attach
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          API_URL: ${{ vars.API_URL }}
          FA_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          FA_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GH_TOKEN: ${{ github.token }}
          WAYPACK_RELEASE_REPO: ${{ github.repository }}
        run: tool/release_mac.sh --notarize --attach "$TAG"
      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
