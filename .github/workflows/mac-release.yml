name: Release Mac app

# On a published GitHub Release tagged v<version>: builds the Mac app, signs it with Developer ID,
# notarizes + staples it, and attaches Waypack.dmg to that release. The site's /download/mac
# redirects to releases/latest/download/Waypack.dmg, so it serves the new DMG once attached.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the DMG to (e.g. v1.2.0)
        required: true

concurrency:
  group: mac-release
  cancel-in-progress: false

permissions:
  contents: write # attach the DMG to the release

jobs:
  mac:
    name: Build, notarize & attach DMG
    runs-on: macos-26
    timeout-minutes: 75
    environment:
      name: GitHub Releases
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode (local releases build with the newest too)
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: ./.github/actions/app-toolchain
      # flutter_inappwebview_macos 1.2.0-beta.3 declares macOS 10.14 but implements a 10.14
      # protocol method as @available(macOS 10.15): Xcode 27 accepts it, Xcode 26's Swift doesn't.
      # The app targets macOS 12, so raising the package's floor to 10.15 changes nothing at runtime.
      # Remove once the plugin fixes it or the runner's Xcode is 27+.
      - name: Patch flutter_inappwebview_macos for Xcode 26
        run: |
          xcodebuild -version
          PKG="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/flutter_inappwebview_macos-1.2.0-beta.3/macos/flutter_inappwebview_macos/Package.swift"
          grep -q '.macOS("10.14")' "$PKG" || { echo "::error::$PKG changed; revisit this patch"; exit 1; }
          sed -i '' 's/.macOS("10.14")/.macOS("10.15")/' "$PKG"
      - uses: ./.github/actions/apple-signing
        with:
          p12-base64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      - name: Version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          V="${TAG#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release tag must look like v1.2.3 (got $TAG)"; exit 1; }
          { echo "TAG=$TAG"; echo "BUILD_NAME=$V"; echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))"; } >> "$GITHUB_ENV"
      - name: Build, notarize, attach
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          API_URL: ${{ vars.API_URL }}
          FA_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          FA_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GH_TOKEN: ${{ github.token }}
          WAYPACK_RELEASE_REPO: ${{ github.repository }}
        run: tool/release_mac.sh --notarize --attach "$TAG"
      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
