name: Apple signing
description: >
  Imports ONE pinned signing identity (a .p12 exported from the release Mac) into a throwaway
  keychain, and writes the App Store Connect API key. Reusing the exported identity matters:
  letting -allowProvisioningUpdates sign on an empty runner keychain mints a new certificate on
  every run, which silently fills Apple's per-team certificate cap until all signing fails.
inputs:
  p12-base64: { description: Base64 of the .p12, required: true }
  p12-password: { description: Password of the .p12, required: true }
  asc-key-id: { description: App Store Connect API key id, required: true }
  asc-key-p8-base64: { description: Base64 of AuthKey_<id>.p8, required: true }
runs:
  using: composite
  steps:
    - name: Write App Store Connect API key
      shell: bash
      env:
        P8: ${{ inputs.asc-key-p8-base64 }}
        KEY_ID: ${{ inputs.asc-key-id }}
      run: |
        mkdir -p "$RUNNER_TEMP/private_keys"
        KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
        echo "$P8" | base64 --decode > "$KEY_PATH"
        chmod 600 "$KEY_PATH"
        echo "FA_KEY_LOCATION=$KEY_PATH" >> "$GITHUB_ENV"
    - name: Import signing identity
      shell: bash
      env:
        P12: ${{ inputs.p12-base64 }}
        P12_PASSWORD: ${{ inputs.p12-password }}
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
        CERT_PATH="$RUNNER_TEMP/signing.p12"
        echo "$P12" | base64 --decode > "$CERT_PATH"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        EXISTING="$(security list-keychains -d user | sed 's/[[:space:]]*"\(.*\)"/\1/')"
        # shellcheck disable=SC2086
        security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING
        security default-keychain -s "$KEYCHAIN_PATH"
        rm -f "$CERT_PATH"
        echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"
